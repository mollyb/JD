name: Role Radar feed

on:
  schedule:
    - cron: "17 12 * * *"   # every day ~4–5am Pacific, before the Claude scan
  workflow_dispatch: {}      # lets you click "Run workflow" by hand

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check job boards
        run: python radar.py
      - name: Save results
        run: |
          git config user.name "role-radar-bot"
          git config user.email "role-radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Role Radar feed $(date -u +%F)"
          git push
